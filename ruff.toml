# Lint rules for the skills' Python scripts. Like eslint.config.js, they aim at
# bugs and security, not formatting. Run: npm run lint:py
target-version = "py39"

[lint]
select = [
  "F",    # pyflakes: undefined names, unused imports
  "E", "W", # pycodestyle errors
  "B",    # bugbear: likely bugs (mutable defaults, loop-variable capture, ...)
  "S",    # bandit: security (shell injection, unsafe temp files, ...)
  "UP",   # pyupgrade: idioms of the target version
  "SIM",  # simplifications
  "C4",   # comprehensions
  "PLE", "PLW", # pylint errors and warnings
  "RUF",  # ruff's own: ambiguous characters, mutable class defaults, ...
]
ignore = [
  # The scripts run `gh` and `git` from PATH with an argument list, never a
  # shell, which is the safe form. These two flag every such call.
  "S603", # subprocess call: check for execution of untrusted input
  "S607", # starting a process with a partial executable path
  # Formatting, not bugs; the long lines are mostly GraphQL queries.
  "E501",
]
